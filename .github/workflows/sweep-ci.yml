# CI for the `tscm/` subtree (the `sweep` counter-surveillance tool) only.
#
# This repository is a fork of VS Code, so this workflow is deliberately scoped
# with `paths:` — it must not fire on upstream commits that never touch
# `tscm/`, and the existing VS Code workflows must not fire on sweep commits.
# The name is distinct from every workflow already here ("CI", "Basic checks",
# "Monaco Editor checks", …) so the two sets stay legible side by side.
#
# What this gate is for, concretely: sweep talks to radios, and the unit suite
# is green on a machine with no radios at all. The two worst defects found
# while building it were both invisible to that suite — a Wi-Fi sensor that
# returned an un-awaited coroutine (dead band, 129 green tests), and a
# `sys.platform` call with no `import sys` that broke the very first run on a
# clean machine. Hence the smoke job, which drives the *installed* console
# script on all three operating systems, and the package job, which inspects
# the built wheel rather than the checkout.

name: sweep CI

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'tscm/**'
      - '.github/workflows/sweep-ci.yml'
  pull_request:
    paths:
      - 'tscm/**'
      - '.github/workflows/sweep-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older one on the same ref.
concurrency:
  group: sweep-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash everywhere, Windows included: `&&` works, and `pip install -e ".[all]"`
    # does not get mangled by PowerShell's wildcard handling of square brackets.
    shell: bash
    working-directory: tscm

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: ruff's default rule set widens between releases, so an
      # unpinned lint turns red on someone else's schedule. The selected
      # rules live in tscm/pyproject.toml; upgrading is a deliberate edit.
      - run: python -m pip install ruff==0.16.9
      - run: ruff check . --output-format=github

  test:
    name: Tests ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux across the supported Python range.
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          # Windows and macOS matter more than usual here: every
          # platform-specific sensor backend (netsh, PowerShell PnP, airport,
          # wdutil) is parsed from real tool output, and both of the parser
          # bugs that reached a user were Windows-only.
          - { os: windows-latest, python: '3.10' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tscm/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest tests/ -q --durations=10

  core-only:
    name: Tests with no optional dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The core is documented as running on the standard library alone — the
      # whole point is that sweep installs on an unfamiliar machine without a
      # package index. This job is what keeps that claim true: no bleak, no
      # pyserial, only the test runner.
      - run: python -m pip install -e "." pytest pytest-asyncio
      - run: python -m pytest tests/ -q
      - name: The CLI still starts without optional dependencies
        # `doctor` exits 2 when no band on this machine can sense anything,
        # which is true of a bare runner and is the exit code doing its job.
        # Only a crash is a failure here.
        run: |
          python -m sweep --help
          SWEEP_HOME="$RUNNER_TEMP/sweep-core" python -m sweep --no-color doctor \
            || [ $? -eq 2 ]

  browser:
    name: Full suite — nothing skipped
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # tests/test_web_ui.py looks for a browser under this root, so set it
      # before installing rather than letting Playwright pick a cache path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Everything optional, installed: Playwright drives the UI in Chromium,
      # and OpenCV decodes the QR codes that the dependency-free encoder in
      # core/qr.py produces. Both of those test files skip themselves when the
      # tooling is absent, which on a developer's machine is the right
      # behaviour and in CI would be a hole.
      - run: python -m pip install -e ".[all,dev]" playwright opencv-python-headless
      - run: python -m playwright install --with-deps chromium
      - name: Run every test, and fail if any of them skipped
        # The browser tests exist because three real defects were invisible to
        # HTTP-level tests: a CSS rule that defeated the `hidden` attribute,
        # touch targets below Apple's 44px minimum, and a missing favicon. The
        # QR test exists because the encoder had a genuine spec bug (the
        # mandatory dark module was being overwritten) that only a decoder
        # caught. A job that silently skips those is worse than no job.
        #
        # Checked by reason rather than by count: one test skips when the
        # runner has no non-loopback address, which is about the environment
        # and not about missing tooling. A skip that blames Playwright,
        # Chromium or OpenCV in *this* job means the install above silently
        # did not take.
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rs | tee full.log
          if grep -iE 'SKIPPED.*(playwright|chromium|opencv)' full.log; then
            echo "::error::optional tooling was installed but its tests still skipped"
            exit 1
          fi

  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[all,dev]"
      # Drives the installed `sweep` console script end to end — doctor on the
      # default database path, a real timed sweep, a JSON report, then the web
      # UI over HTTP including every static asset. No hardware required: a
      # runner with no radios must still pass.
      - run: python scripts/smoke.py

  package:
    name: Build and verify the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # The web UI is read from disk at runtime, so a package-data mistake
      # builds, installs and starts fine and then 404s every page. Inspect the
      # archive, not the checkout.
      - run: python scripts/check_wheel.py dist/*.whl
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          export PATH="$RUNNER_TEMP/clean/bin:$PATH"
          sweep --no-color doctor || [ $? -eq 2 ]   # 2 == this runner is blind
          python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-dist
          path: tscm/dist/*
          if-no-files-found: error
          retention-days: 14

  # One required check for branch protection, so the list of jobs above can
  # change without re-configuring the branch rule.
  sweep-ci:
    name: sweep CI
    runs-on: ubuntu-latest
    needs: [lint, test, core-only, browser, smoke, package]
    if: always()
    # This job never checks the repository out, so it must not inherit the
    # `tscm` working directory — the step would fail before running.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "core-only=${{ needs['core-only'].result }}"
          echo "browser=${{ needs.browser.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "package=${{ needs.package.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
